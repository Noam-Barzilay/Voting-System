<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voting Complete</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to right, #2c3e50, #4ca1af);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    .box {
      background: white;
      padding: 40px 60px;
      border-radius: 10px;
      box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.2);
      color: #2c3e50;
      text-align: center;
    }

    .box h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    .box p {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Thank You!</h1>
    <p>Your vote has been submitted successfully.</p>
  </div>
</body>
</html>
