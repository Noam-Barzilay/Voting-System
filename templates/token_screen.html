<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Session Token</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #2c3e50, #4ca1af);
      height: 100vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10%;
      color: white;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .left-panel .icon {
      background-color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .left-panel .icon img {
      width: 30px;
      height: 30px;
    }

    .left-panel h1 {
      margin: 0;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
    }

    .token-box {
      background: white;
      color: #333;
      padding: 40px;
      border-radius: 10px;
      width: 420px;
      box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .token-box p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .token-box strong {
      font-size: 20px;
      color: #2c3e50;
    }

    .button {
      padding: 12px 24px;
      background-color: #1f5d87;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #144768;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        justify-content: center;
        padding: 20px;
      }

      .left-panel {
        align-items: center;
        margin-bottom: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="left-panel">
    <div class="icon">
      <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="lock icon">
    </div>
    <h1>VOTING SYSTEM</h1>
  </div>

  <div class="token-box">
    <p>Your generated token is: <strong>{{ generated_token }}</strong></p>

    <form action="/get_token/{{ user_id }}" method="post">
      <button class="button" type="submit">Continue to voting screen</button>
    </form>
  </div>
</body>
</html>
