<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Voting Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #2c3e50, #4ca1af);
      height: 100vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10%;
      color: white;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .left-panel .icon {
      background-color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .left-panel .icon img {
      width: 30px;
      height: 30px;
    }

    .left-panel h1 {
      margin: 0;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
    }

    .login-box {
      background: white;
      color: #333;
      padding: 40px;
      border-radius: 10px;
      width: 420px;
    box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.2);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #2c3e50;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group i {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #bbb;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 12px 12px 36px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      color: #333;
    }

    .button {
      width: 100%;
      padding: 12px;
      background-color: #1f5d87;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #1f5d87;
    }

    .secondary-button {
      background-color: #1f5d87;
    }

    .secondary-button:hover {
      background-color: #5d6d6d;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        justify-content: center;
        padding: 20px;
      }
      .left-panel {
        align-items: center;
        margin-bottom: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="left-panel">
    <div class="icon">
      <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="lock icon">
    </div>
    <h1>SECURE VOTING SYSTEM</h1>
  </div>

  <div class="login-box">
    <h2>LOGIN</h2>
    <form method="POST">
      <label for="id">ID:</label>
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" name="id" id="id" placeholder="ID" required>
      </div>

      <label for="otp">One-Time Password (OTP):</label>
      <div class="input-group">
        <i class="fas fa-key"></i>
        <input type="text" name="otp" id="otp" placeholder="OTP" required>
      </div>

      <button class="button" type="submit">Confirm Id and OTP</button>
      <button class="button secondary-button" type="submit" formaction="/generate_otp">Generate OTP</button>
    </form>

  </div>
</body>
</html>
